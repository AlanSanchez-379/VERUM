name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: verum-finanzas
  DOTNET_VERSION: "9.0.x"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Verum.sln

      - name: Build
        run: dotnet build Verum.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Verum.Tests/Verum.Tests.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish Verum.Web/Verum.Web.csproj --configuration Release --output ./publish

      - name: Azure login (OIDC, sin contraseñas guardadas)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
